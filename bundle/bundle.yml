schema_version: '1.0'
bundle:
  id: whetstone
  name: Whetstone
  version: 0.7.1
  role: developer
  description: Review a change with pr-review-toolkit, drop bikeshedding, size each fix, and check every claim its text makes; a report for the person or agent who fixes it. Reads the repository only.
  author: Kirill Andriychuk
  license: MIT
requires:
  speckit_version: '>=1.3.3'
  tools:
  - git
  - uv
  - claude
  mcp: []
integration:
  id: claude
provides:
  extensions:
  - id: whetstone-core
    version: 0.7.1
  - id: whetstone-review
    version: 0.7.1
  - id: whetstone-triage
    version: 0.7.1
  - id: whetstone-shim-check
    version: 0.7.1
  - id: whetstone-claim-check
    version: 0.7.1
  steps:
  - id: decision
    version: 0.9.0
  workflows:
  - id: whetstone-review
    version: 0.7.1
  - id: whetstone-triage
    version: 0.7.1
  - id: whetstone-shim-check
    version: 0.7.1
  - id: whetstone-claim-read
    version: 0.7.1
  - id: whetstone-claim-judge
    version: 0.7.1
  - id: whetstone-claim-check
    version: 0.7.1
  - id: whetstone-canary
    version: 0.7.1
  - id: whetstone
    version: 0.7.1
tags:
- review
- workflow
- claude
