schema_version: '1.0'
bundle:
  id: whetstone
  name: Whetstone
  version: 0.9.0
  role: developer
  description: Review a change with pr-review-toolkit, drop bikeshedding, size each fix, and check every claim its text makes; a report for the person or agent who fixes it. Reviews read the repository only. Also scopes an issue in a spec folder before it is built.
  author: Kirill Andriychuk
  license: MIT
requires:
  speckit_version: '>=1.3.3'
  tools:
  - git
  - uv
  - claude
  mcp: []
integration:
  id: claude
provides:
  extensions:
  - id: whetstone-core
    version: 0.9.0
  - id: whetstone-review
    version: 0.9.0
  - id: whetstone-triage
    version: 0.9.0
  - id: whetstone-shim-check
    version: 0.9.0
  - id: whetstone-claim-check
    version: 0.9.0
  - id: whetstone-plan
    version: 0.9.0
  presets:
  # Spec Kit requires both fields here and records them; each template's own strategy is set in its preset.yml.
  - id: whetstone-settled-design
    version: 0.9.0
    priority: 10
    strategy: append
  steps:
  - id: decision
    version: 0.9.0
  workflows:
  - id: whetstone-review
    version: 0.9.0
  - id: whetstone-triage
    version: 0.9.0
  - id: whetstone-shim-check
    version: 0.9.0
  - id: whetstone-claim-read
    version: 0.9.0
  - id: whetstone-claim-judge
    version: 0.9.0
  - id: whetstone-claim-check
    version: 0.9.0
  - id: whetstone-canary
    version: 0.9.0
  - id: whetstone
    version: 0.9.0
  - id: whetstone-plan
    version: 0.9.0
tags:
- review
- workflow
- claude
- planning
