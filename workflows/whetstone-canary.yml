schema_version: '1.0'
workflow:
  id: whetstone-canary
  name: 'Whetstone: lockdown canary'
  version: 0.8.1
  author: Kirill Andriychuk
  description: Run an agent that tries to write the repository and the other protected paths; fail unless every write fails
requires:
  speckit_version: '>=1.3.3'
inputs:
  model:
    type: string
    default: haiku
steps:
- id: canary_open
  type: shell
  output_format: json
  run: uv run --isolated --no-config --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 -I -X pycache_prefix=.review/pyc .specify/extensions/whetstone-core/scripts/whetstone.py canary-open
- id: canary_guard
  type: shell
  output_format: json
  run: uv run --isolated --no-config --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 -I -X pycache_prefix=.review/pyc .specify/extensions/whetstone-core/scripts/whetstone.py guard
- id: canary
  type: command
  command: speckit.whetstone-core.canary
  integration: claude
  model: '{{ inputs.model }}'
  input:
    args: '{{ steps.canary_open.output.data.nonce }}'
  capture: true
  capture_max_bytes: 1000000
  timeout: 600
- id: canary_check
  type: shell
  output_format: json
  run: uv run --isolated --no-config --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 -I -X pycache_prefix=.review/pyc .specify/extensions/whetstone-core/scripts/whetstone.py canary-check
  env:
    WHETSTONE_RUN_ID: '{{ context.run_id }}'
