schema_version: '1.0'
workflow:
  id: whetstone-apply
  name: 'Whetstone: apply'
  version: 0.3.0
  author: Kirill Andriychuk
  description: Fix, reject, defer or escalate each actionable finding and write .review/current/decisions.json
requires:
  speckit_version: '>=1.3.3'
steps:
- id: apply
  type: command
  command: speckit.whetstone-apply.run
  integration: claude
  capture: true
  capture_max_bytes: -1
  timeout: 3600
- id: checks
  type: shell
  output_format: json
  run: uv run --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 .specify/extensions/whetstone-apply/scripts/run_checks.py
- id: validate
  type: shell
  output_format: json
  run: uv run --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 .specify/extensions/whetstone-core/scripts/whetstone.py validate
    decisions.schema.json .review/current/decisions.json
