schema_version: '1.0'
workflow:
  id: whetstone-shim-check
  name: 'Whetstone: shim check'
  version: 0.8.1
  author: Kirill Andriychuk
  description: Decide the defect class, other occurrences and fix strategy of each actionable finding; write .review/current/shim-check.json. Reads the repository only.
requires:
  speckit_version: '>=1.3.3'
steps:
- id: shim_check_guard
  type: shell
  output_format: json
  run: uv run --isolated --no-config --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 -I -X pycache_prefix=.review/pyc .specify/extensions/whetstone-core/scripts/whetstone.py guard
- id: shim_check
  type: command
  command: speckit.whetstone-shim-check.run
  integration: claude
  capture: true
  capture_max_bytes: 8000000
  timeout: 3600
- id: shim_check_fetch
  type: shell
  output_format: json
  run: uv run --isolated --no-config --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 -I -X pycache_prefix=.review/pyc .specify/extensions/whetstone-core/scripts/whetstone.py
    fetch shim-check.json --command speckit.whetstone-shim-check.run
  env:
    WHETSTONE_RUN_ID: '{{ context.run_id }}'
- id: validate
  type: shell
  output_format: json
  run: uv run --isolated --no-config --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 -I -X pycache_prefix=.review/pyc .specify/extensions/whetstone-core/scripts/whetstone.py
    validate shim-check.schema.json .review/current/shim-check.json
