schema_version: '1.0'
workflow:
  id: whetstone
  name: Whetstone
  version: 0.6.0
  author: Kirill Andriychuk
  description: Review a change with pr-review-toolkit, drop bikeshedding, size each fix, and check every claim its text makes; a report for the person or agent who fixes it. Reads the repository only.
requires:
  speckit_version: '>=1.3.3'
inputs:
  triage:
    type: boolean
    default: true
  shim_check:
    type: boolean
    default: true
  claim_check:
    type: boolean
    default: true
  claim_model:
    type: string
    default: sonnet
  triage_threshold:
    type: number
    default: 0.5
  allow_protected:
    type: boolean
    default: false
steps:
- id: setup
  type: shell
  output_format: json
  run: uv run --isolated --no-config --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 -I -X pycache_prefix=.review/pyc .specify/extensions/whetstone-core/scripts/whetstone.py setup
  env:
    WHETSTONE_TRIAGE: t={{ inputs.triage }}
    WHETSTONE_ALLOW_PROTECTED: t={{ inputs.allow_protected }}
    WHETSTONE_RUN_ID: '{{ context.run_id }}'
- id: canary
  type: workflow
  workflow: whetstone-canary
- id: review
  type: workflow
  workflow: whetstone-review
- id: triage_on
  type: if
  condition: '{{ inputs.triage }}'
  then:
  - id: triage
    type: workflow
    workflow: whetstone-triage
    input:
      threshold: '{{ inputs.triage_threshold }}'
- id: summary
  type: shell
  output_format: json
  run: uv run --isolated --no-config --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 -I -X pycache_prefix=.review/pyc .specify/extensions/whetstone-core/scripts/whetstone.py summarize
  env:
    WHETSTONE_RUN_ID: '{{ context.run_id }}'
- id: shim_check_on
  type: if
  condition: '{{ inputs.shim_check and steps.summary.output.data.actionable > 0 }}'
  then:
  - id: shim_check
    type: workflow
    workflow: whetstone-shim-check
- id: claim_check_on
  type: if
  condition: '{{ inputs.claim_check }}'
  then:
  - id: claim_check
    type: workflow
    workflow: whetstone-claim-check
    input:
      model: '{{ inputs.claim_model }}'
- id: report
  type: shell
  output_format: json
  run: uv run --isolated --no-config --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 -I -X pycache_prefix=.review/pyc .specify/extensions/whetstone-core/scripts/whetstone.py report
  env:
    WHETSTONE_RUN_ID: '{{ context.run_id }}'
- id: needs_human
  type: if
  condition: '{{ steps.report.output.data.needs_human }}'
  then:
  - id: claims_gate
    type: gate
    message: '{{ steps.report.output.data.message }}'
    options:
    - approve
    - reject
    on_reject: abort
- id: finish
  type: shell
  output_format: json
  run: uv run --isolated --no-config --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 -I -X pycache_prefix=.review/pyc .specify/extensions/whetstone-core/scripts/whetstone.py finish
  env:
    WHETSTONE_GATE: '{{ steps.claims_gate.output.choice | default("") }}'
    WHETSTONE_RUN_ID: '{{ context.run_id }}'
