schema_version: '1.0'
workflow:
  id: whetstone
  name: Whetstone
  version: 0.3.0
  author: Kirill Andriychuk
  description: Review a branch with pr-review-toolkit, drop bikeshedding, choose patch or class fixes, and fix within the PR until nothing important is left.
requires:
  speckit_version: '>=1.3.3'
inputs:
  triage:
    type: boolean
    default: true
  shim_check:
    type: boolean
    default: true
  triage_threshold:
    type: number
    default: 0.5
steps:
- id: setup
  type: shell
  output_format: json
  run: uv run --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 .specify/extensions/whetstone-core/scripts/whetstone.py setup
  env:
    WHETSTONE_TRIAGE: t={{ inputs.triage }}
- id: loop
  type: do-while
  max_iterations: 3
  condition: '{{ steps.summary.output.data.actionable > 0 }}'
  steps:
  - id: round
    type: shell
    output_format: json
    run: uv run --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 .specify/extensions/whetstone-core/scripts/whetstone.py
      begin-round
  - id: review
    type: workflow
    workflow: whetstone-review
  - id: triage_on
    type: if
    condition: '{{ inputs.triage }}'
    then:
    - id: triage
      type: workflow
      workflow: whetstone-triage
      input:
        threshold: '{{ inputs.triage_threshold }}'
  - id: summary
    type: shell
    output_format: json
    run: uv run --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 .specify/extensions/whetstone-core/scripts/whetstone.py
      summarize
  - id: needs_fix
    type: if
    condition: '{{ steps.summary.output.data.actionable > 0 }}'
    then:
    - id: shim_check_on
      type: if
      condition: '{{ inputs.shim_check }}'
      then:
      - id: shim_check
        type: workflow
        workflow: whetstone-shim-check
    - id: apply
      type: workflow
      workflow: whetstone-apply
    - id: apply_check
      type: shell
      output_format: json
      run: uv run --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 .specify/extensions/whetstone-core/scripts/whetstone.py
        check-apply
- id: unreviewed_fixes
  type: if
  condition: '{{ steps.summary.output.data.actionable > 0 }}'
  then:
  - id: round_final
    type: shell
    output_format: json
    run: uv run --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 .specify/extensions/whetstone-core/scripts/whetstone.py
      begin-round
  - id: review_final
    type: workflow
    workflow: whetstone-review
  - id: triage_on_final
    type: if
    condition: '{{ inputs.triage }}'
    then:
    - id: triage_final
      type: workflow
      workflow: whetstone-triage
      input:
        threshold: '{{ inputs.triage_threshold }}'
  - id: summary_final
    type: shell
    output_format: json
    run: uv run --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 .specify/extensions/whetstone-core/scripts/whetstone.py
      summarize
  - id: still_actionable
    type: if
    condition: '{{ steps.summary_final.output.data.actionable > 0 }}'
    then:
    - id: human
      type: gate
      message: Actionable findings remain after the loop; see .review/current/summary.json and .review/ledger.json.
      options:
      - approve
      - reject
      on_reject: abort
- id: finish
  type: shell
  output_format: json
  run: uv run --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.2 python3 .specify/extensions/whetstone-core/scripts/whetstone.py finish
