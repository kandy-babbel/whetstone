# Repository settings for whetstone-triage: what the evidence for each finding contains.
# Spec Kit copies this file to .specify/extensions/whetstone-triage/whetstone-triage-config.yml
# when the extension is installed and never overwrites that copy. Edit and commit the copy.
# Everything listed here is sent to the decision step's backend with each finding.

# Files that state the repository's rules, besides the conventions `setup` records on
# its own (every CLAUDE.md and the files under .claude/rules/, as they are on the base
# commit), which are always included. A missing file is noted as missing.
rule_files:
  - AGENTS.md
# Tool configuration files (formatter, linter, task runner).
config_files: []
# The CI workflow whose check steps are included; "" for none.
ci_workflow: ""
# From that workflow, steps whose name contains check, test, lint or format are
# included, and `run:` lines starting with one of these commands.
ci_run_prefixes: []
# Lines of code shown on each side of the reported line.
context_lines: 20
