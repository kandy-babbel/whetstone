schema_version: '1.0'
extension:
  id: whetstone-triage
  name: 'Whetstone: triage'
  version: 0.5.0
  description: Evidence gathering and result collection for deciding, with a decision model, whether each
    blocking finding is bikeshedding.
  author: Kirill Andriychuk
  license: MIT
requires:
  speckit_version: '>=1.3.3'
provides:
  config:
  - name: whetstone-triage-config.yml
    template: whetstone-triage-config.template.yml
    description: Rules, configs and CI steps included in the triage evidence
  scripts:
  - name: gather
    file: scripts/gather.py
    description: Build one evidence file per blocking finding
    runtimes: &id001
    - python
  - name: collect
    file: scripts/collect.py
    description: Turn the decision results into triage.json
    runtimes: *id001
tags:
- review
- whetstone
