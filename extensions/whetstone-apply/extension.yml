schema_version: '1.0'
extension:
  id: whetstone-apply
  name: 'Whetstone: apply'
  version: 0.3.0
  description: Fixes, rejects, defers or escalates each actionable finding within the PR's files, runs
    the checks, and records the decisions.
  author: Kirill Andriychuk
  license: MIT
requires:
  speckit_version: '>=1.3.3'
provides:
  config:
  - name: whetstone-apply-config.yml
    template: whetstone-apply-config.template.yml
    description: Commands the apply step must make pass
  scripts:
  - name: run-checks
    file: scripts/run_checks.py
    description: Run the configured checks after the agent and fail if any fails
    runtimes:
    - python
  commands:
  - name: speckit.whetstone-apply.run
    file: commands/run.md
    description: Act on the actionable findings of a round and write decisions.json
tags:
- review
- whetstone
