schema_version: '1.0'
extension:
  id: whetstone-core
  name: 'Whetstone: core'
  version: 0.8.1
  description: Schemas for the modules' contracts and the deterministic checker that validates them, applies
    fallbacks for switched-off modules, takes the agents' answers from the run state, and writes the report.
  author: Kirill Andriychuk
  license: MIT
requires:
  speckit_version: '>=1.3.3'
provides:
  config:
  - name: whetstone-core-config.yml
    template: whetstone-core-config.template.yml
    description: Base ref the loop reviews against
  scripts:
  - name: whetstone
    file: scripts/whetstone.py
    description: setup, guard, fetch, canary-open, canary-check, validate, summarize, report, finish
    runtimes:
    - python
  - name: lockdown
    file: scripts/lockdown.py
    description: the agents' required flags (`lockdown.py flags` prints them), TMPDIR and integrity checks, pinned git, and text cleaning
    runtimes:
    - python
  - name: runstate
    file: scripts/runstate.py
    description: the agents' answers, read from Spec Kit's run state
    runtimes:
    - python
  - name: repo
    file: scripts/repo.py
    description: the repository under review (the working directory, or the clone under repo/), its change tree and path canonicalisation
    runtimes:
    - python
  - name: canary
    file: scripts/canary.py
    description: run by the canary agent; tries to write the repository and each protected path
    runtimes:
    - python
  commands:
  - name: speckit.whetstone-core.canary
    file: commands/canary.md
    description: 'Internal step of a Whetstone run; do not run it directly (to review a change, use speckit-whetstone-core-review). Run the lockdown canary'
  - name: speckit.whetstone-core.review
    file: commands/review.md
    description: Review a branch or the current change with Whetstone, then report its findings and checked claims
tags:
- review
- whetstone
