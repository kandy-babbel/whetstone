schema_version: '1.0'
extension:
  id: whetstone-claim-check
  name: 'Whetstone: claim check'
  version: 0.8.0
  description: Quotes every claim the text of a change makes and has a judge try to break each claim about the
    repo's own code or about what a test checks. Reads only.
  author: Kirill Andriychuk
  license: MIT
requires:
  speckit_version: '>=1.3.3'
provides:
  scripts:
  - name: claimcheck
    file: scripts/claimcheck.py
    description: prepare, check-read, accept, check-verdict, settle
    runtimes:
    - python
  commands:
  - name: speckit.whetstone-claim-check.read
    file: commands/read.md
    description: 'Internal step of a Whetstone run; do not run it directly (to review a change, use speckit-whetstone-core-review). Label the hunks of one claim-check batch and quote the claims their text makes'
  - name: speckit.whetstone-claim-check.judge
    file: commands/judge.md
    description: 'Internal step of a Whetstone run; do not run it directly (to review a change, use speckit-whetstone-core-review). Try to break one claim and rule it CORRECT, WRONG or UNSURE, with path:line evidence'
tags:
- review
- whetstone
