schema_version: "1.0"

preset:
  id: "whetstone-settled-design"
  name: "Whetstone: settled design"
  version: "0.9.0"
  description: "spec.md has a section for the premise answers and one for the root cause; plan.md lists its mechanisms, each citing a research.md decision that has an Existing tools field. The whetstone-plan workflow checks all three."
  author: "Kirill Andriychuk"
  repository: "https://github.com/kandy-babbel/whetstone"
  license: "MIT"

requires:
  speckit_version: ">=1.3.3"

provides:
  templates:
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Append the Mechanisms section and the research.md decision format"
      strategy: "append"
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Append the premise answers and the root cause section"
      strategy: "wrap"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "The premise answers come from the premise report; the root cause follows the spec template"
      strategy: "append"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Research decisions follow the plan template's format"
      strategy: "append"

tags:
  - "planning"
  - "whetstone"
